{{ block content }}
<form method="post">
    {% if player.treatment == 'creature' %}
        {% include "global/BG.html" %}
    {% elif player.treatment == 'plant' %}
        {% include "global/BG_plant.html" %}
    {% endif %}
    <button class="btn btn-primary" style="display: none" id="next-button">Next</button>
</form>

{{ endblock }}

{{ block scripts }}
    <script>
        // After 20 seconds, display the "Next" button
        setTimeout(function() {
        document.getElementById('next-button').style.display = 'block';
        }, 20 * 1000);
    </script>
{{ endblock }}
