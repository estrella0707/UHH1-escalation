{% load static %}
<link rel="stylesheet" href="{% static 'likert.css' %}">

<b>The vocabulary and grammar are...</b>
<div class="likert-line">
    <span class="question-label"></span>
    <span class="end-label">Very easy</span>
    <div class="likert-scale">
        {% for i in "1234567" %}
        <input type="radio" name="simple_language" id="simple_language{{ i }}" value="{{ i }}">
        <label for="simple_language{{ i }}"></label>
        {% endfor %}
    </div>
    <span class="end-label">Very difficult</span>
</div>
{{ formfield_errors 'simple_language' }}
