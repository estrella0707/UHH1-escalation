{% load static %}
<link rel="stylesheet" href="{% static 'likert.css' %}">

<b>How much do the argument and policy sound familiar to you?</b>
<div class="likert-line">
    <span class="question-label"></span>
    <span class="end-label">Not at all</span>
    <div class="likert-scale">
        {% for i in "1234567" %}
        <input type="radio" name="complex_familiar" id="complex_familiar{{ i }}" value="{{ i }}">
        <label for="complex_familiar{{ i }}"></label>
        {% endfor %}
    </div>
    <span class="end-label">Very much so</span>
</div>
{{ formfield_errors 'complex_familiar' }}
