{% load static %}
<link rel="stylesheet" href="{% static 'likert.css' %}">

<div class="likert-line">
    <span class="question-label"><b>I have lost faith in the previous argument.</b></span>
    <span class="end-label">Strongly disagree</span>

    <div class="likert-scale">
        {% for i in "1234567" %}
        <input type="radio" name="why3_argument" id="why3_argument{{ i }}" value="{{ i }}">
        <label for="why3_argument{{ i }}"></label>
        {% endfor %}
    </div>

    <span class="end-label">Strongly agree</span>
</div>
{{ formfield_errors 'why3_argument' }}
