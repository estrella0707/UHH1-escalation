{% load static %}
<link rel="stylesheet" href="{% static 'likert.css' %}">
<b>Do you think it is the fault of the alien creatures or not?</b>
<div class="likert-line">
    <span class="end-label">Not at all</span>
    <div class="likert-scale">
        {% for i in "1234567" %}
        <input type="radio" name="complex_fault" id="complex_fault{{ i }}" value="{{ i }}">
        <label for="complex_fault{{ i }}"></label>
        {% endfor %}
    </div>
    <span class="end-label">Very much so</span>
  </div>
</div>
{{ formfield_errors 'complex_fault' }}
<br>
