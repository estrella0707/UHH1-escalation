{% load static %}
<link rel="stylesheet" href="{% static 'likert.css' %}">
<b>How confident are you that the argument in the above leaflet correctly captures the truth?</b>
<div class="likert-line">
    <span class="question-label"></span>
    <span class="end-label">Very unconfident</span>
    <div class="likert-scale">
        {% for i in "1234567" %}
        <input type="radio" name="confidence0_simple_argument" id="confidence0_simple_argument{{ i }}" value="{{ i }}">
        <label for="confidence0_simple_argument{{ i }}"></label>
        {% endfor %}
    </div>
    <span class="end-label">Very confident</span>
</div>
{{ formfield_errors 'confidence0_simple_argument' }}
