{% load static %}
<link rel="stylesheet" href="{% static 'likert.css' %}">

<div class="likert-line">
    <span class="question-label">The vocabulary and grammar are...</span>
    <span class="end-label">Very easy</span>

    <div class="likert-scale">
        {% for i in "1234567" %}
        <input type="radio" name="mq_policy_language" id="mq_policy_language{{ i }}" value="{{ i }}">
        <label for="mq_policy_language{{ i }}"></label>
        {% endfor %}
    </div>

    <span class="end-label">Very difficult</span>
</div>
{{ formfield_errors 'mq_policy_language' }}
